<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exam Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css\user\success.css' %}">
</head>
<body>

<div class="container">

    <!-- <img src="{% static 'images/Vjiss.png' %}" alt="College Logo" class="logo"> -->
    <img src="{% static 'images/python.png' %}" alt="Python Logo" class="logo">

    <h1 class="exam">
        Login Successful 🎉
    </h1>

    <p class="subtitle">
        Welcome to the Online Examination Portal.
        Your authentication has been completed successfully.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

   

    <div class="footer">
        © 2026 Examination Management System
    </div>

</div>

</body>
</html>
