<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 {% if messages %}
    {% for message in messages %}
        <h3
            {% if message.tags == 'success' %}
                style="color: green;"
            {% elif message.tags == 'error' %}
                style="color: red;"
            {% elif message.tags == 'warning' %}
                style="color: orange;"
            {% elif message.tags == 'info' %}
                style="color: blue;"
            {% endif %}
        >
            {{ message }}
        </h3>
    {% endfor %}
{% endif %}
</body>
</html>
