<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Challenge Portal</title>

  
</head>
<style>
/* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    padding:20px;

    background:linear-gradient(135deg,#0f172a,#2563eb);
    font-family:'Poppins',sans-serif;
}

.page-container{
    width:100%;
    max-width:1100px;   /* Smaller container */
    margin:auto;
}

.main-card{
    background:#fff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:28px;
    margin-bottom:8px;
}

.header p{
    font-size:14px;
}

.question-card{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;

    padding:15px 18px;
    margin-bottom:15px;

    border-left:5px solid #2563eb;
    border-radius:12px;
    background:#fafafa;

    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.question-number{
    font-size:11px;
}

.question-content h2{
    font-size:17px;
    margin:5px 0;
}

.question-content p{
    font-size:13px;
    line-height:1.5;
}

.start-btn{
    padding:10px 18px;
    font-size:13px;
    border-radius:8px;

    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    color:white;
    text-decoration:none;
    font-weight:600;
}

.start-btn:hover{
    transform:translateY(-2px);
}

/* Responsive */

@media(max-width:900px){

    .question-card{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .button-area{
        margin-left:0;
        width:100%;
    }

    .start-btn{
        width:100%;
        text-align:center;
    }
}

@media(max-width:600px){

    .main-card{
        padding:25px;
    }

    .header h1{
        font-size:30px;
    }

    .question-content h2{
        font-size:20px;
    }

    .question-content p{
        font-size:14px;
    }
}
</style>
<body>
    {% include 'user/timer.html' %}

    <div class="page-container">

        <div class="main-card">

            <div class="header">
    		<h1>Coding Challenge Portal</h1>
    		<p>Select a question and begin your challenge.</p>
	    </div>
     
{% for coding_question in coding_question %}
        
            <div class="question-card">
                <div class="question-content">
                    <span class="question-number">Question {{ forloop.counter }}</span>
                   <h2>{{coding_question.title}}</h2> 
                </div>

                <div class="button-area">
                    <a href="{% url 'code_test' coding_question.id %}" class="start-btn">
                        Start Challenge
                    </a>
                </div>
            </div>
        
    {% endfor %}
          

        </div>

    </div>

</body>
</html>
